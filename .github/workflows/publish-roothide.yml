name: Build and publish NetSpeedStatus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tweak source
        uses: actions/checkout@v4
        with:
          repository: m9d2/network-speed
          ref: main
          path: network-speed

      - name: Setup RootHide Theos and iOS SDK
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: roothide/theos
          theos-branch: master
          sdks-src: waruhachi/sdks
          sdks-branch: main
          libgcuniversal: "true"
          libgcuniversal-src: waruhachi/LibGcUniversal
          libgcuniversal-branch: main

      - name: Build RootHide package
        run: make -C network-speed clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Refresh APT repository
        run: |
          set -euo pipefail
          mkdir -p debs
          find debs -maxdepth 1 -type f \( -name 'com.example.netspeedstatus_*.deb' -o -name 'com.m9d2.netspeedstatus_*.deb' -o -name 'com.m9d2.wangsu_*.deb' \) -delete
          cp network-speed/packages/com.m9d2.wangsu_*.deb debs/
          python3 network-speed/scripts/build_repo.py .

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedStatus-roothide-deb
          path: debs/com.m9d2.wangsu_*.deb
          if-no-files-found: error

      - name: Publish package and indexes to this repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debs Packages Packages.gz Release index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish NetSpeedStatus RootHide package"
            git push origin HEAD:main
          fi
